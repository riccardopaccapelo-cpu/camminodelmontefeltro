<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentiero sbagliato — Cammino del Montefeltro</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
@font-face{font-family:'Newsreader';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/newsreader-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:400;font-display:swap;src:url('/fonts/newsreader-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/archivo-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/archivo-latin-600-normal.woff2') format('woff2')}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:flex-end;color:#FAF7EF;font:400 1.05rem/1.6 'Archivo',system-ui,sans-serif;
  background:linear-gradient(to top,rgba(24,32,18,.92) 0%,rgba(24,32,18,.55) 45%,rgba(24,32,18,.15) 100%),url('/img/hero-montefeltro.webp') center right/cover #2F3D24}
@media(max-width:760px){body{background:linear-gradient(to top,rgba(24,32,18,.92) 0%,rgba(24,32,18,.5) 50%,rgba(24,32,18,.1) 100%),url('/img/hero-montefeltro-verticale.webp') center bottom/cover #2F3D24}}
main{max-width:70rem;width:100%;margin:0 auto;padding:0 1.5rem 4.5rem}
h1{font:400 clamp(2.4rem,7vw,4.2rem)/1.08 'Newsreader',Georgia,serif;letter-spacing:-.015em;margin-bottom:.8rem}
h1 em{color:#8FA678}
p{max-width:30rem;margin-bottom:1.6rem}
a{display:inline-block;background:#B7791F;color:#fff;font-weight:600;font-size:.95rem;padding:.7em 1.4em;border-radius:2px;text-decoration:none}
a:hover,a:focus-visible{background:#9C6415}
</style>
</head>
<body>
<main>
  <h1><em>Sentiero</em> sbagliato</h1>
  <p>Questa pagina non esiste, o è stata spostata. Capita anche ai camminatori migliori: si torna all'ultimo segnavia.</p>
  <a href="/">Torna al Cammino</a>
</main>
</body>
</html>
